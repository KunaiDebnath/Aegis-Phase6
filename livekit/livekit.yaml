# AEGIS Phase 5 - Self-Hosted LiveKit Server Configuration
# Local Wi-Fi Development on Windows Laptop

port: 7880
bind_addresses:
  - ""

rtc:
  # TCP fallback for environments where UDP is blocked
  tcp_port: 7881
  # Dedicated port range for WebRTC media (UDP)
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  # node_ip: fallback value. run-livekit.ps1 automatically passes --node-ip with the active router LAN IP.
  node_ip: "192.168.1.4"

# API keys and secrets for server token verification
keys:
  aegis_key: aegis_dev_secret_key_for_livekit_safety_calling_32b

logging:
  level: info
